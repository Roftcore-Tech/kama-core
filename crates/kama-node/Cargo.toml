[package]
name = "kama-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# BİLEŞİM KÖKÜ (K4G-11; plan D8 v1.1, D9 v1.1, D11): ürünü ayağa kaldıran TEK crate. Provisioning
# dosyası (kimlik, anahtarlar, eş dizini — BELLEKTE, depoya yazılmaz), kalıcı depo
# (`kama-store::RedbStore`; `AppStore` + `CounterStore` olarak AYNI nesne), gerçek saat ve entropi,
# gerçek UDP veri yolu (`client-core`) ve uygulama motorları (`kama-app`) burada birleşir.
#
# INV-NEIGHBOR-1'in TEK istisnasıdır: her katmana bağlanır ama YALNIZ kurar, protokol mantığı
# taşımaz. Crypto (`kama-noise-wire`) adı ürün kaynağında yalnız kurma modülünde (`src/wiring.rs`)
# geçer — `scripts/ci/layer_check.py` C8. Altyapı crate'i `kama-store`'a bağlanabilen tek crate
# budur (C7).
#
# D11: yeni harici bağımlılık YOK — yalnız workspace crate'leri + `thiserror` (workspace sürümü).
# Yeni async runtime YOK: veri yolunun tokio'su `client-core`'un içindedir (`ClientTransport`
# kendi çalışma-zamanını taşır); düğüm döngüsü bir `std::thread`'dir.
# [YOL3 · gösterim] `adaptive-transport`: yalnız gösterim profilinin bayrak TİPLERİ (`E1Flags`,
# `E2aFlags`; `src/goster.rs`). İsteğe bağlı: yalnız `goster` ve `test-util` açar (modül de yalnız
# onlarla derlenir). Zaten `client-core` üzerinden grafikte; yeni derlenen paket yok, ürün API yüzeyi
# (client-core) değişmez (KK-Ö-38).
[dependencies]
adaptive-transport = { path = "../adaptive-transport", optional = true }
client-core = { path = "../client-core" }
kama-app = { path = "../kama-app" }
kama-contracts = { path = "../kama-contracts" }
kama-noise-wire = { path = "../kama-noise-wire" }
kama-provision = { path = "../kama-provision" }
kama-store = { path = "../kama-store" }
thiserror.workspace = true

[features]
# YALNIZ test / ölçüm düzeneği. K4G-11'de bu özelliğe bağlı öğe yoktu (DUR-K4G-11 → B: test kurucusu
# `start_with_envelope_link` kaldırıldı; özellik kilit dosyası değişmesin diye korunmuştu). [K4G-05]
# INT-02 (`kama-integration`) için: ölçüm sondası (`KamaNode::probe_for_test`, `src/probe.rs`),
# canlı teşhis aynası açık kurucu (`KamaNode::start_live_diag_for_test`; DUR-19) ve recovery-OFF
# negatif kolunun kurucusu (`KamaNode::start_recovery_off_for_test`). Ürün yolu (`KamaNode::start`)
# bu özellikten bağımsızdır; ürün bağımlılığında AÇILMAZ. `client-core/test-util`: kurtarma ve canlı
# ayna anahtarları, oturum tablosu okuyucuları (`set_recovery_for_test`, `set_live_diag_for_test`,
# `peer_of_for_test`, `outstanding_for_test`).
test-util = ["client-core/test-util", "dep:adaptive-transport"]
# [YOL3 · Ö · KK-Ö-28] Gösterim düğümü (A yolu telefonları; `.so` `--features kama-node/goster` ile,
# orkestratör derler): ürün kurucusu `KamaNode::start` gösterim profilini (`src/goster.rs`: FEC yok,
# gösterim seti K1A6 = K1 + A-1…A-6 (E1 + E2a bayrakları), S1 şeritleri W = 5, PTT oynatma tamponu
# T) kurar. Varsayılan KAPALI; kapalıyken ürün yolu bit-aynı. `test-util` ile birlikte ETKİSİZ
# (KK-Ö-39: `--all-features` testleri ürün yolunu sınamaya devam eder); gösterim ikilisi `test-util`
# açmadan derlenir. Yeni dış bağımlılık yok.
# Gösterim; kapılı PoC ölçümü Aralık; ARQ yolu, FEC Aralık'ta; sığ tamponlu ağ gösterim kapsamı dışı.
goster = ["dep:adaptive-transport"]

[dev-dependencies]
# Kendi `test-util` özelliğini entegrasyon testlerine açar (client-core'daki kalıp; bkz. yukarıdaki
# not). Yalnız test derlemesinde; ürün grafiğine girmez.
kama-node = { path = ".", features = ["test-util"] }
# Birim testlerinin salt-okunur test kancası (`ClientTransport::inbox_len_for_test`) — YALNIZ test;
# ürün bağımlılığında `test-util` AÇILMAZ.
client-core = { path = "../client-core", features = ["test-util"] }

[lints]
workspace = true
