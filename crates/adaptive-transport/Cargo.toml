[package]
name = "adaptive-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "test-util"] }

[features]
# Commit-V: test-only/non-default CANLI-BÜTÇE-PROTOTİPİ (CONDITIONAL-GO).
# OFF (default): FloorCap-kodu-üretim-yoluna-BAĞLANMAZ; derlenmiş-yol-baseline-özdeş.
experimental-fec-budget = []
# DR-CS-1 (MINIMAL BOOTSTRAP): cold-start batch-API + CS-probe merdiveni. DEFAULT-OFF; flag
# yalnız-LOCAL (M7); OFF'ta adapter-devre-dışı + legacy-tekil-yol byte-for-byte (INV-CS-5).
experimental-cold-start = []

[[example]]
name = "udp_budget_runner"
required-features = ["experimental-fec-budget"]
