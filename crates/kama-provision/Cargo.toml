[package]
name = "kama-provision"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# K4G-12 — PROVISIONING-FORMAT-v0 (docs/provisioning/PROVISIONING-FORMAT-v0.md). Kütüphane hedefi biçim
# tiplerini ve doğrulayan yükleyiciyi taşır (K4G-11 bileşim kökü cihaz dosyasını aynı tiplerle okur);
# ikili hedef (`src/main.rs`) `kama-provision` CLI'ıdır. Argüman ayrıştırma std-only (clap yok, D11).

[dependencies]
# Genel API: CompactDeviceCert uzunluğu + `cert_ref_of` (ccr §35.2), katı Ed25519 doğrulaması (ccr §5.2),
# OS entropisi (`OsEntropy`) ve eş dizini tipleri (`LocalIdentity`, `PeerDirectory`).
kama-noise-wire = { path = "../kama-noise-wire" }
# D11: JSON biçimi — workspace'teki mevcut sürümler.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# D11 BEYANI: aşağıdaki dört crate Cargo.lock'ta ZATEN kilitli (kama-noise-wire'ın bağımlılıkları) ve
# özellik kümeleri kama-noise-wire'ınkinin alt kümesidir → Cargo.lock'a yeni paket girmez. Gerekçe:
# kama-noise-wire'ın genel API'si Ed25519 imzası ÜRETMEZ (yalnız doğrular), X25519 açık anahtarını
# gizliden türetmez, genel SHA-256 (ccr §8.1 spki, CAD-16) ve sıfırlanan tampon sunmaz.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = { version = "0.10", default-features = false }
zeroize = "1"

[lints]
workspace = true
