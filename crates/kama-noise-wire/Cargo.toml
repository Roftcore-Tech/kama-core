[package]
name = "kama-noise-wire"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[features]
# DR-CS-1b/A2: urun-alici cold-start dar-dilimleri (unregister/tombstone/A-4). DEFAULT-OFF.
experimental-cold-start = []
# K-WIRE-SEALED-TYPE-1: test-constructor'ı dış-crate entegrasyon-testlerine açar (production-build'de KAPALI).
# [B1 2026-10-05] Aynı özellik `seam_mock::MockCrypto`'yu (S3 §7 sahtesi) da açar; sahte, sözleşme
# tiplerinin ham erişimlerine `kama-contracts/test-util` üzerinden ulaşır.
test-util = ["kama-contracts/test-util"]
# KATMAN-3 (DR-5): RustCrypto==libsodium AEAD differential-oracle. TEST-ONLY, DEFAULT-KAPALI →
# production-dependency-graph'ına GİRMEZ (ayrı-CI-job: `cargo test --features libsodium-oracle`).
# Sistem-libsodium'a linklenir (native).
libsodium-oracle = ["dep:sodiumoxide"]

[dependencies]
# S1/S3 sözleşme tipleri (R-7(b); B1). Bu crate S3'ü implemente eder; `client-core`'a ve `kama-app`'e
# bağımlı OLAMAZ (dev-dependency dahil) — scripts/ci/layer_check.py kural C3.
kama-contracts = { path = "../kama-contracts" }
kama-transport-schema = { path = "../kama-transport-schema" }
thiserror.workspace = true
# AEAD production-backend: RustCrypto ChaCha20-Poly1305 IETF (RFC 8439; ADR-03/DR-5; pki-§13 primitif).
chacha20poly1305 = "0.10"
# param_hash production-backend: RustCrypto BLAKE2s-256 (noise-wire-tdd §8; ADR-03/DR-S5-5; pki-§13 primitif).
blake2 = "0.10"
zeroize = "1"
# ── A5.0 kripto çekirdeği bağımlılıkları (R-7(b): implementasyon bu crate'te; primitifler pki §13) ──
# KDF: HKDF-BLAKE2s (ccr §35.2.1). `hkdf::SimpleHkdf<Blake2s256>` kullanılır — `hkdf::Hkdf<Blake2s256>`
# DERLENMEZ (BLAKE2'nin blok API'si lazy; `Hkdf`'in istediği eager-buffer bound'unu sağlamaz).
# `blake2::Blake2sMac`'e GEÇİLMEZ: o BLAKE2s'in keyed modudur, HMAC DEĞİLDİR (INV-KDF-3).
hkdf = "0.12"
hmac = "0.12"
# DH: X25519 (RFC 7748). `reusable_secrets`: Bob'un ephemeral'ı iki DH'de kullanılır (ss_e2, ccr §35.2.1 D4);
# `static_secrets`: cihazın STATİK X25519 anahtarı (ss_s; identity CAD-36) — bu feature olmadan `StaticSecret`
# tipi yoktur; `zeroize`: sırlar Drop'ta silinir.
x25519-dalek = { version = "2", default-features = false, features = ["reusable_secrets", "static_secrets", "zeroize"] }
# İmza doğrulama: Ed25519 (RFC 8032; ccr §5.2 katı kip). `zeroize`: imza anahtarı Drop'ta silinir.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
# SHA-256 (pki §13): `sender_cert_ref`, `session_context_v1` içindeki SHA-256(recipient_static_pub),
# DeviceCertBundle `device_cert_hash` (ccr §35.2 / §20). [B1 — Abkarada onayı 2026-10-08: YALNIZ
# sha2 → kama-noise-wire.] Kilit dosyasında ed25519-dalek üzerinden zaten vardı (aynı sürüm).
sha2 = { version = "0.10", default-features = false }
# Entropi: OS kaynağı (`OsRng`); testlerde enjekte edilebilir kaynak A4.1'de (exact vektörler için şart).
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
# libsodium IETF-ChaCha20-Poly1305 independent-oracle — YALNIZ `libsodium-oracle` feature'ıyla (test-only).
# PIN (=0.2.7): differential-oracle sürümü sabit (libsodium-sys bundled-libsodium build; Cargo.lock-teyitli).
sodiumoxide = { version = "=0.2.7", optional = true }

[dev-dependencies]
proptest = "1"
trybuild = "1"
# Test-vektör hex yardımcısı (T-00.2): golden_wire.rs / sprint5b_legacy.rs / rfc8439_vectors.rs
# içindeki üç yerel `fn hex` kopyasının yerine.
kama-vectors = { path = "../kama-vectors" }

# S3 sözleşme süiti `MockCrypto`'yu kullanır → `test-util` ister. Özellik kapalıyken hedef ATLANIR
# (trybuild sealed-type kapısı `test-util` KAPALI koşmak zorunda; bu yüzden self dev-dependency ile
# özelliği her test derlemesinde açmak yerine hedef-düzeyi şart kullanılır). Koşucu
# (scripts/ci/noise-conformance.sh) özelliği AÇIKÇA verir ve 0 testi kırmızı sayar.
[[test]]
name = "noise_conformance_core"
path = "tests/noise_conformance_core/main.rs"
required-features = ["test-util"]

[lints]
workspace = true
