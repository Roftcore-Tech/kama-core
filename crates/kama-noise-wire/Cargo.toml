[package]
name = "kama-noise-wire"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[features]
# DR-CS-1b/A2: urun-alici cold-start dar-dilimleri (unregister/tombstone/A-4). DEFAULT-OFF.
experimental-cold-start = []
# K-WIRE-SEALED-TYPE-1: test-constructor'ı dış-crate entegrasyon-testlerine açar (production-build'de KAPALI).
test-util = []
# KATMAN-3 (DR-5): RustCrypto==libsodium AEAD differential-oracle. TEST-ONLY, DEFAULT-KAPALI →
# production-dependency-graph'ına GİRMEZ (ayrı-CI-job: `cargo test --features libsodium-oracle`).
# Sistem-libsodium'a linklenir (native).
libsodium-oracle = ["dep:sodiumoxide"]

[dependencies]
kama-transport-schema = { path = "../kama-transport-schema" }
thiserror.workspace = true
# AEAD production-backend: RustCrypto ChaCha20-Poly1305 IETF (RFC 8439; ADR-03/DR-5; pki-§13 primitif).
chacha20poly1305 = "0.10"
# param_hash production-backend: RustCrypto BLAKE2s-256 (noise-wire-tdd §8; ADR-03/DR-S5-5; pki-§13 primitif).
blake2 = "0.10"
zeroize = "1"
# libsodium IETF-ChaCha20-Poly1305 independent-oracle — YALNIZ `libsodium-oracle` feature'ıyla (test-only).
# PIN (=0.2.7): differential-oracle sürümü sabit (libsodium-sys bundled-libsodium build; Cargo.lock-teyitli).
sodiumoxide = { version = "=0.2.7", optional = true }

[dev-dependencies]
proptest = "1"
trybuild = "1"
# Test-vektör hex yardımcısı (T-00.2): golden_wire.rs / sprint5b_legacy.rs / rfc8439_vectors.rs
# içindeki üç yerel `fn hex` kopyasının yerine.
kama-vectors = { path = "../kama-vectors" }
[lints]
workspace = true