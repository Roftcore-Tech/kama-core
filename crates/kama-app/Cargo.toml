[package]
name = "kama-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# APPLICATION KATMANI (WS-B). INV-NEIGHBOR-1: Application'ın TEK alt komşusu Transport'tur ve onu
# yalnız S1 sözleşmesi (`kama_contracts::s1::KamaTransport`) üzerinden görür.
#
# BU CRATE'İN KATMAN BAĞIMLILIĞI YALNIZ `kama-contracts`'TIR. Şunlar DOĞRUDAN YA DA GEÇİŞLİ olarak
# buraya giremez: `kama-noise-wire`, `crypto`, `ccr-codec`, `client-core`, `kama-engine`,
# `adaptive-transport`, `kama-fec-codec`, `kama-transport-schema` ve ham kripto primitifleri
# (dalek/chacha/blake2/hkdf…). Plane 1 (app-rpc) tipleri de giremez: `AppRpcFrame`, `method_id` bu
# crate'te YASAK semboldür. `kama-contracts`'ın `test-util` özelliği burada AÇILAMAZ.
# Hepsini `scripts/ci/layer_check.py` kapıda denetler (KM-SEAM-AT-001 §6 H-NO-CRYPTO-EDGE /
# H-NO-PLANE1).
[dependencies]
kama-contracts = { path = "../kama-contracts" }

