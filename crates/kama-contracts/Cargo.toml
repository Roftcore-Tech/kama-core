# NEDEN AYRI CRATE: trait'ler bir katmanın crate'inde dururken komşu katman onları implemente etmek
# için o crate'e bağımlı olmak zorundaydı — S3'te bu bir DÖNGÜ (client-core ↔ kama-noise-wire), S1'de
# TERS YÖN (Transport → Application) demekti; trait Transport'a taşınsa Application geçişli olarak
# kriptoya bağlanırdı (INV-NEIGHBOR-1 ihlali). Sözleşme hiçbir katmana ait değildir.
#
# BU CRATE'E BAĞIMLILIK EKLENMEZ: ne workspace crate'i ne harici crate; normal, dev ya da build fark
# etmez (`thiserror` YOK — `Display` + `Error` elle yazılır). `scripts/ci/layer_check.py` kural C1
# bunu kapıda denetler.
