# [P3] Fuzz kabuğu — güvenilmeyen-girdi parser'ları (SR-AUDIT-001 sertleştirme kapısı) +
# SR-STR-CORE-001 §5.2 (TC-08/TC-09/TC-10) hedefleri. İki fuzz seti birleşimidir (main 5 + test 6 = 11 hedef).
# Workspace'ten AYRIK ([workspace] boş): nightly+libfuzzer yalnız burada; üretim grafiğine girmez.
[package]
name = "kama-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
adaptive-transport = { path = "../crates/adaptive-transport" }
kama-noise-wire = { path = "../crates/kama-noise-wire" }
client-core = { path = "../crates/client-core" }
# S3 trait'i (`PacketProtection`) B1'den beri burada; wire_v0 `IdentitySeam::open`'ı onun üzerinden çağırır.
kama-contracts = { path = "../crates/kama-contracts" }
kama-transport-schema = { path = "../crates/kama-transport-schema" }
kama-fec-codec = { path = "../crates/kama-fec-codec" }
zeroize = "1"

[workspace]

[profile.release]
debug = 1

# ── main (P3) hedefleri ──
[[bin]]
name = "ack_decode"
path = "fuzz_targets/ack_decode.rs"
test = false
doc = false

[[bin]]
name = "fec_decode"
path = "fuzz_targets/fec_decode.rs"
test = false
doc = false

[[bin]]
name = "noise_wire_decode"
path = "fuzz_targets/noise_wire_decode.rs"
test = false
doc = false

[[bin]]
name = "protector_open"
path = "fuzz_targets/protector_open.rs"
test = false
doc = false

[[bin]]
name = "wire_v0"
path = "fuzz_targets/wire_v0.rs"
test = false
doc = false

# ── SR-STR-CORE-001 hedefleri (test branch) ──
# TC-08: AEAD-baypaslı inner-parser hedefi (BUL-04'ün çekirdeği)
[[bin]]
