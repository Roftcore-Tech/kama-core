[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/ccr-codec",
    "crates/adaptive-transport",
    "crates/kama-transport-schema",
    "crates/kama-fec-codec",
    "crates/hub-server",
    "crates/client-core",
    "crates/ra-ca",
    "crates/discovery",
    "crates/admin-server",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

[workspace.dependencies]
thiserror = "2"
blake2 = "0.10"
tokio = { version = "1", features = ["time"] }
