[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/ccr-codec",
    "crates/adaptive-transport",
    "crates/kama-transport-schema",
    "crates/kama-fec-codec",
    "crates/kama-noise-wire",
    "crates/kama-engine",
    "crates/kama-integration",
    "crates/hub-server",
    "crates/client-core",
    "crates/ra-ca",
    "crates/discovery",
    "crates/admin-server",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

# Kani biçimsel doğrulama `cfg(kani)` kullanır; `cargo test`/`clippy` bunu tanımadığı için
# `-D warnings` altında `unexpected_cfgs` hatası verir. Burada tanıtılır.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.dependencies]
thiserror = "2"
blake2 = "0.10"
tokio = { version = "1", features = ["time"] }
