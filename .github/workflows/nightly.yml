name: core-nightly

# ── SHARD'LI, TIMEOUT'LU GECELİK ──────────────────────────────────────────────────────────────
# [CI-REPAIR 2026-09-08] Ölçülen sorunlar:
#   · 5 gecelik koşunun 5'i de kırmızı; wall-clock ortalaması 644 dk, biri TAM 24 saat
#     (netem-gate self-hosted runner'da kuyrukta/asılı kaldı — `timeout-minutes` kuyruk süresini
#     KAPSAMAZ, bu yüzden job artık açık bir repo değişkenine kapılı).
#   · `kani` her gece kaynaktan `cargo install kani-verifier` yapıyordu ve zaten
#     `continue-on-error: true` olduğu için hiçbir şeyi kapılamıyordu → haftalığa alındı.
#   · `fuzz-deep` 6 hedef × 30 dk = ~3.5 saat/gece. Hedef başına 10 dk'ya indirildi (corpus
#     birikimi korunur; derinlik haftalık kolda).
#   · `fuzz-smoke` PR'da "error: no such command: fuzz" ile 8/16 koşuda kırmızıydı — kök neden
#     install-action'ın kısayol formu; açık `tool:` girdisiyle düzeltildi ve buraya taşındı.
#
# HOSTILE SHARD'LARI (T0–T7) ayrı job'lardır, her biri kendi timeout'uyla. Yalnız `NETEM_RUNNER`
# repo değişkeni 'true' iken koşarlar (self-hosted netem runner'ı gerektirir).

#
# [CI-REPAIR-2 2026-10-04] Ölçülen sorunlar (4 Eylül–3 Ekim, 30 koşu):
#   · `fuzz` HİÇ koşmamış: hazır cargo-fuzz ikilisi musl için derlenmiş ve varsayılan hedefi musl
#     alıyor → "sanitizer is incompatible with statically linked libc". Her gece 6 job ~1 dakikada
#     kırmızı. Düzeltme: `--target <host>` (scripts/ci/fuzz-all.sh).
#   · `branch-coverage` HİÇ koşmamış: `--fail-under-branches` cargo-llvm-cov'da yok. Haftalığa
#     taşındı ve ratchet kapısına bağlandı (weekly.yml, scripts/ci/branch-coverage-gate.py).
#   · main 9 gece boyunca değişmedi ama iş her gece yeniden koştu → `changes` kapısı: son YEŞİL
#     koşudan beri kod değişmediyse gecelik hiç koşmaz (scripts/ci/schedule-guard.sh).
#   · 6 fuzz hedefi 6 ayrı job'dı (6 ayrı derleme + 6 ayrı faturalama yuvarlaması) → tek job,
#     tek derleme, hedef başına 5 dk.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_hostile:
        description: "T0–T7 hostile shard'larını koştur (netem runner gerekir)"
        type: boolean
        default: false

concurrency:
  group: core-nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read      # schedule-guard son yeşil koşuyu okur

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Koşmaya değer mi? (son yeşilden beri kod değişti mi) ──
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          scripts/ci/schedule-guard.sh nightly.yml
          crates fuzz Cargo.toml Cargo.lock rust-toolchain.toml
          scripts/ci/fuzz-all.sh scripts/ci/schedule-guard.sh .github/workflows/nightly.yml
          scripts/ci/seam-mutation.py ref/amp/encode.py
          vectors/amp-record-v1.json vectors/amp-record-reject-v1.json
          crates/kama-app/tests/common/mock_transport.rs crates/kama-integration/tests

  # ── CI-08: fuzz (6 hedef × 5 dk, TEK job, tek derleme; corpus biriktirilir) ──
  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-all-
          restore-keys: fuzz-corpus-all-
      - name: fuzz (6 hedef × 5 dk)
        run: scripts/ci/fuzz-all.sh 300
      - name: save corpus
        if: success()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-all-${{ github.run_id }}
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  sim-nightly:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p adaptive-transport --test desen1_sim -- --ignored --nocapture

  # ── [F0.6 2026-10-06] S1 sözleşme satırlarının MUTASYON turu — sahteye karşı, ağaç dışı ──
  # PR başına KOŞMAZ (ci.yml'deki ci-verdict `skipped`'i kırmızı sayar; koşullu job oraya konamaz).
  # ~49 küçük-workspace derlemesi (48 mutasyon + 1 taban; koşum başına RUN_TIMEOUT_S = 900 s tavan);
  # ilk koşu süreyi ölçer — timeout-minutes ona göre ayarlanır. `--online`: taze runner'da kayıt
  # önbelleği yok (betiğin varsayılanı --offline). CARGO_BUILD_JOBS betik içinde 2.
  seam-mutation:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 -B scripts/ci/seam-mutation.py --online

  # ── [F0.6 2026-10-06] AMP vektörleri: Python üretici ↔ commit'li JSON bayt-özdeşliği ──
  # encode.py `compression.zstd` ister (Python 3.14+); ubuntu-latest Python'u onu taşımaz →
  # setup-python ile 3.14. İki vaka (encode.text-compressed, decode.truncated-zstd-stream) libzstd
  # sürümüne bağlı bayt taşır (encode.py başlığı): runner'ın libzstd'si yerel üreticiden farklıysa
  # dosya hiç değişmeden FARKLI çıkabilir — ilk koşu bunu ölçer; sürüm bu yüzden loglanır.
  amp-vectors-check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: libzstd sürümü (bayt farkı teşhisi için)
        run: python3 -c "from compression import zstd; print('zstd', zstd.zstd_version)"
      - name: encode.py --check (vectors/amp-*.json bayt-özdeş mi)
        run: python3 -B ref/amp/encode.py --check

  # ── CI-07 / ADR-18: hostile netem shard'ları ──────────────────────────────────────────────
  # Her rejim AYRI job + AYRI timeout. `NETEM_RUNNER` repo değişkeni olmadan HİÇ kuyruğa girmez
  # (24 saatlik asılı kalmanın kök nedeni buydu).
  hostile:
    name: "hostile ${{ matrix.regime }}"
    needs: changes
    if: needs.changes.outputs.run == 'true' && vars.NETEM_RUNNER == 'true' && (github.event_name == 'schedule' || inputs.run_hostile)
    runs-on: [self-hosted, linux, netem]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1          # tek netem runner'ı: shard'lar sırayla
      matrix:
        regime:
          - random-loss
          - burst-loss
          - high-latency
          - low-bandwidth
          - asymmetric-path
          - degraded-return
          - mixed-loss-reorder
          - competitor-comparison
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: preflight (netem + ürün profili)
        run: |
          set -e
          lsmod | grep -q sch_netem || sudo modprobe sch_netem \
            || { echo "::error title=INFRA_FAILURE::sch_netem yok"; exit 1; }
          test -x scripts/netem/kapi3_harness.sh \
            || { echo "::error title=INFRA_FAILURE::netem harness yok"; exit 1; }
      - name: build bench (release)
        run: cargo build --release -p bench --bin bench
      # [FAZ-5 KAPISI] Gerçek T0–T7 koşumu Benchmark Metodolojisi (Faz-4) kapanmadan ETKİNLEŞMEZ.
      # O ana dek shard yalnız harness'ın ve ÜRÜN PROFİLİNİN canlı olduğunu kanıtlar.
      # [FAZ-4 §14] ADR-18 gecelik kolu KANONİK ÜRÜN PROFİLİNİ kurar (elle yeniden yazılmış
      # sevk config'i YOK), yapılandırma + aktivasyon manifestini üretir ve sapma varsa
      # "Kama v1" etiketini REDDEDER.
      - name: activation proof (ürün profili gerçekten koşuyor mu)
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/act-${{ matrix.regime }}"
          bash scripts/netem/v1_activation_proof.sh "$D" 2>&1 | tee /tmp/act.txt
          grep -q "profile=kama-v1-full" /tmp/act.txt \
            || { echo "::error title=BENCHMARK_FAILURE::kosu urun profili DEGIL (kama-custom)"; exit 1; }
      - name: manifest gate (§14 — sapma varsa Kama v1 etiketi REDDEDİLİR)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/act-${{ matrix.regime }}"
          n=$(find "$D" -name manifest.json | wc -l)
          [ "$n" -ge 1 ] || { echo "::error title=BENCHMARK_FAILURE::kosu manifesti URETILMEDI"; exit 1; }
          for m in $(find "$D" -name manifest.json); do
            arm=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['arm'])" "$m")
            delta=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['profile_delta']))" "$m")
            act=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['activation']['fec_configured'])" "$m")
            echo "$m arm=$arm delta=$delta fec_configured=$act"
            [ "$arm" = "kama-v1-full" ] && [ "$delta" = "0" ] \
              || { echo "::error title=BENCHMARK_FAILURE::$m urun profili DEGIL (arm=$arm delta=$delta)"; exit 1; }
          done
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostile-${{ matrix.regime }}
          path: ${{ runner.temp }}/act-${{ matrix.regime }}

  nightly-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, fuzz, sim-nightly, seam-mutation, amp-vectors-check, hostile]
    if: always()
    steps:
      - run: |
          R='${{ join(needs.*.result, ',') }}'
          echo "job sonuçları: $R  (changes.run=${{ needs.changes.outputs.run }})"
          if [[ "$R" == *failure* ]]; then echo "::error title=TEST_FAILURE::gecelik kapida kirmizi var"; exit 1; fi
          if [[ "$R" == *cancelled* ]]; then echo "::warning title=TIMEOUT::gecelik job iptal/timeout"; exit 1; fi
          echo "gecelik yesil (atlananlar: kod degismediyse tum isler; NETEM_RUNNER yoksa hostile shard'lari)"
