name: core-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all --all-features
      - run: cargo build --release --all

  # DR-RATE-RAMP-2B §A1 / AŞAMA-2: `--all-features` CANNOT stand in for the default build.
  # Two real breakages hid here: a test target that stopped compiling under default features, and a
  # LIB that stopped compiling under `--features experimental-fec-budget` alone. Each configuration
  # below is built AND tested on its own, and every step prints its own compiled/run/filtered counts.
  semantic-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-workspace
            args: ""
          - name: all-features
            args: "--all-features"
          - name: experimental-cold-start
            args: "-p adaptive-transport -p kama-integration --features experimental-cold-start"
          - name: experimental-fec-budget
            args: "-p adaptive-transport --features experimental-fec-budget"
          - name: diagnostic
            args: "-p adaptive-transport -p kama-integration --features diag-sched-telemetry"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: "build (${{ matrix.name }})"
        run: cargo build --all-targets ${{ matrix.args }}
      - name: "clippy (${{ matrix.name }})"
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings
      - name: "test (${{ matrix.name }}) with visible counts"
        run: |
          set -o pipefail
          cargo test ${{ matrix.args }} 2>&1 | tee /tmp/out.txt
          echo "----- ${{ matrix.name }} summary -----"
          COMPILED=$(grep -c '^     Running ' /tmp/out.txt || true)
          RUN=$(grep -oP '^test result: \w+\. \K[0-9]+' /tmp/out.txt | paste -sd+ - | sed 's/^$/0/' | bc)
          FILTERED=$(grep -oP '; \K[0-9]+(?= filtered out)' /tmp/out.txt | paste -sd+ - | sed 's/^$/0/' | bc)
          IGNORED=$(grep -oP '; \K[0-9]+(?= ignored)' /tmp/out.txt | paste -sd+ - | sed 's/^$/0/' | bc)
          echo "test_binaries_compiled=$COMPILED"
          echo "tests_run=$RUN"
          echo "tests_ignored=$IGNORED"
          echo "tests_filtered_out=$FILTERED"
          if [ "$COMPILED" -eq 0 ]; then echo "no test binary compiled for ${{ matrix.name }}"; exit 1; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # +nightly rust-toolchain.toml'daki 1.96.0 pin'ini ezer (rustup precedence #1);
      # düz `cargo miri test` stable'a düşer ve miri stable'da olmadığından FAIL ederdi.
      - run: cargo +nightly miri test -p crypto -p ccr-codec

  # KATMAN-3 (DR-5): RustCrypto==libsodium AEAD differential-oracle. AYRI-CI-JOB — production-graph-dışı
  # (libsodium-oracle feature default-KAPALI). sodiumoxide=0.2.7 PIN (bundled-libsodium vendored-build; cc yeter).
  # HARD-FAIL: byte-eş değilse gate düşer. Isolated: libsodium-env-sorunu ana quality-gate'i BLOKLAMAZ.
  aead-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kama-noise-wire --features libsodium-oracle --test aead_differential -- --nocapture

  # [P3] Fuzz-smoke: güvenilmeyen-girdi parser'ları (ack/fec/noise-wire/protector/wire-v0) —
  # hedef başına 60 s libFuzzer. Yeni crash = gerçek parser kusuru = kapı düşer (SR-AUDIT-001).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - run: cargo install cargo-fuzz --locked
      - run: |
          for t in ack_decode fec_decode noise_wire_decode protector_open wire_v0; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 || exit 1
          done
