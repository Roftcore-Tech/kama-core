name: core-ci

# ── PR GERİ-BİLDİRİM HALKASI (hızlı, deterministik, sınırlı) ───────────────────────────────────
# [CI-REPAIR 2026-09-08] Bu dosya ÖLÇÜLEREK yeniden yapılandırıldı. Önceki hâli her PR push'unda
# ~233 faturalanan runner-dakikası harcıyordu (19 koşuda 4433 dk) ve GitHub Actions kotasını
# tüketip tüm pipeline'ı "billing" hatasıyla düşürdü. Ölçülen dağılım:
#   quality 141 dk (tam test setini DÖRT kez koşuyordu: locked / all-features / no-default / release)
#   semantic-matrix 5 shard = 180 dk · coverage 45 dk (continue-on-error, hep timeout)
#   diğer tüm job'lar toplam < 10 dk
# Ayrıca `concurrency` YOKTU: 22:29/22:30/22:31'de aynı PR için üç tam koşu paralel başladı.
#
# YENİ SÖZLEŞME:
#   PR      → yalnız hızlı, deterministik doğruluk (bu dosya)
#   main    → geniş entegrasyon + semantic-matrix + release/no-default/soak (main.yml)
#   nightly → shard'lı, timeout'lu, hostile/fuzz/coverage yükleri (nightly.yml)
#
# Ağır kama-integration panelleri PR'dan ÇIKARILDI (ölçüm: dr_cs3_v2_channel 21.3 dk,
# fs_s6_v2_pins 4.1 dk, fs_arqtail_pins 1.9 dk = test süresinin %65'i). main.yml onları TAM
# workspace koşumunda çalıştırır; feature-unification sözleşmesi (M1) orada korunur.

on:
  pull_request:
    paths-ignore:
      - 'reports/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Aynı dal için yalnız EN SON koşu yaşar. (Ölçüldü: iptal edilmeyen paralel koşular kotanın
# en büyük tek çarpanıydı.)
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Statik kapılar (fmt + iki clippy görünümü) ──
  static:
    name: static (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (all-features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # CI-05 — production görünümü (feature-unification kapısı)
      - name: clippy (no-default-features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  # ── Hızlı doğruluk: tam workspace, ağır entegrasyon panelleri hariç ──
  test-fast:
    name: test (all-features, hızlı küme)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # CI-01 — trybuild/K-WIRE-SEALED-TYPE-1 YALNIZ default-feature koşumunda çalışır.
      - name: sealed-type gate (default features, locked)
        run: |
          set -o pipefail
          out=$(cargo test -p kama-noise-wire --locked --test trybuild -- --list)
          echo "$out"
          echo "$out" | grep -q "sealed_type_cannot_be_forged" \
            || { echo "::error title=TEST_FAILURE::K-WIRE-SEALED-TYPE-1 kapisi 0 test kosuyor (BUL-03 regresyonu)"; exit 1; }

      - name: test (workspace --all-features, kama-integration hariç)
        run: cargo test --workspace --all-features --exclude kama-integration

      # [DENETİM] Ürün profili ve mekanizma-kablolaması PR'da deterministik olarak pinlenir.
      - name: product-profile invariants + activation smoke
        run: |
          set -o pipefail
          cargo test -p client-core --all-features --test product_profile_v1 2>&1 | tee /tmp/pp.txt
          grep -Eq "test result: ok\. [1-9][0-9]* passed" /tmp/pp.txt \
            || { echo "::error title=TEST_FAILURE::urun-profili pin testi 0 test kosuyor"; exit 1; }
          cargo test -p adaptive-transport --all-features --test fec_loss_risk

  # ── Conformance: vektör ↔ uygulama (T-00.3) ──
  # Vektör ya da ilgili kod değiştiğinde kimsenin "koşmayı unutması" mümkün olmasın.
  #
  # NEDEN `paths:` YOK. GitHub Actions'ta `paths` yalnız workflow düzeyinde (`on:`) tanımlanır,
  # iş düzeyinde YOKTUR; bu dosyada zaten workflow düzeyi `paths-ignore` var ve oraya `paths`
  # eklemek TÜM job'ları etkilerdi. Ayrıca `paths` ile atlanan bir required check sonsuza kadar
  # "pending" kalıp PR'ı kilitler. Bu yüzden kapı HER ZAMAN koşar; görev metnindeki tetik
  # listesi script içinde yalnız TEŞHİS olarak basılır (gerekçe: scripts/ci/conformance.sh
  # başlığı). Maliyet düşük: tüm workspace değil, yalnız kama-vectors + keşfedilen conformance
  # hedefleri derlenir ve rust-cache test-fast ile paylaşılır.
  conformance:
    name: conformance (vektör ↔ uygulama)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — tetik teşhisi PR tabanına karşı diff alır (varsayılan sığ klon yetmez).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Kapının kendi kapısı: üç muhafızın (ratchet / koşum / vakum) gerçekten kırmızı
      # olduğunu geçici bir conf_* testiyle kanıtlar, sonra temizler.
      - name: conformance kapısının öz-testi
        run: scripts/ci/conformance-selftest.sh
      - name: conformance kapısı
        env:
          CONF_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/conformance.sh

  # ── Ucuz derin kapılar (hepsi < 5 dk; ölçüldü) ──
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: miri (transport-schema) + non-empty gate assertion
        run: |
          set -o pipefail
          cargo +nightly miri test -p kama-transport-schema 2>&1 | tee miri.log
          grep -Eq "test result: ok\. [1-9][0-9]* passed" miri.log \
            || { echo "::error title=TEST_FAILURE::miri kapisi 0 test kosuyor (BUL-02 regresyonu)"; exit 1; }

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ASan (noise-wire)
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: cargo +nightly test -p kama-noise-wire -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: ASan (fec-codec)
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: cargo +nightly test -p kama-fec-codec -Zbuild-std --target x86_64-unknown-linux-gnu

  msan:
    name: msan (uninitialized memory, SIMD deps)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: msan (kama-fec-codec)
        env:
          RUSTFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins"
        run: cargo +nightly test -p kama-fec-codec --tests --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: msan (kama-noise-wire)
        env:
          RUSTFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins"
        run: cargo +nightly test -p kama-noise-wire --tests --target x86_64-unknown-linux-gnu -Zbuild-std

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      # BUL-14 / AÇIK-2: sodiumoxide 0.2.7 → RUSTSEC-2021-0137 (unmaintained; bakımsız-uyarı,
      # istismar edilebilir açık DEĞİL). Karar verilene dek AÇIKÇA yok sayılır — aksi hâlde job
      # her koşuda kırmızı olur ve kapı sinyal taşımaz (ölçüldü: 4/16 kırmızının nedeni buydu).
      - name: cargo audit (bilinen bakımsız-uyarı hariç)
        run: cargo audit --ignore RUSTSEC-2021-0137
      - name: cargo deny
        run: cargo deny check

  aead-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kama-noise-wire --features libsodium-oracle --test aead_differential -- --nocapture

  # ── Test-vektör format kapısı (T-00.1 / T-00.2) ──
  # Üç araç (Python üretici, Rust yükleyici, bu doğrulayıcı) aynı byte beklentisini okur;
  # vectors/SCHEMA.json o üçlünün tek format otoritesidir. Doğrulayıcının bağımlılığı yok
  # (stdlib-only), bu yüzden job saniyeler sürer ve toolchain kurulumu gerektirmez.
  #
  # Bu job PYTHON tarafıdır. Rust tarafı (crates/kama-vectors + Python↔Rust parite testi)
  # `test-fast` içindeki `cargo test --workspace` ile koşar; ikisinin vaka listesi
  # scripts/vectors/testdata/EXPECTATIONS.json'da TEK yerde durur.
  vectors:
    name: vectors (SCHEMA.json kapısı, python tarafı)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # ADR-03 doktrini (primary + cross-check) şema tarafında da uygulanır: doğrulayıcının
      # kendi alt-küme motoru BİRİNCİL, `jsonschema` BAĞIMSIZ MERCİ. Kurulum ~2 sn; kurulum
      # olmadan --cross-check sessizce atlanır ve "çapraz kontrol var" iddiası vakumda kalır.
      - name: bağımsız oracle (jsonschema)
        run: python3 -m pip install --quiet --disable-pip-version-check jsonschema
      - name: doğrulayıcı öz-testi (fixture'lar + şema öz-denetimi + vakum kapıları)
        run: scripts/vectors/selftest.sh
      # --min-files: yol yanlış yazılırsa ya da ağaç boşalırsa doğrulayıcı 0 dosya gezip
      # YEŞİL dönerdi (BUL-02/BUL-03 ile aynı vakum sınıfı).
      # --require-cross-check: jsonschema yoksa sessiz atlama DEĞİL, hata.
      # Bulgular GITHUB_ACTIONS=true sayesinde ::error anotasyonu olarak PR diff'ine iliştirilir.
      - name: vectors/ ağacı (kanonik + vakum + bağımsız oracle)
        run: |
          python3 scripts/vectors/validate.py vectors/ \
            --canonical --min-files 2 --require-cross-check
      # Şema kapısı BİÇİMİ denetler, KAPSAMI değil: ccr §30.7'nin 24 adlandırılmış negatif
      # vakasından hiçbiri yazılmasa bile yemyeşil kalırdı. Ratchet kapsamın düşmesini
      # engeller (bugün 4/24; borç görünür ve yalnız azalabilir).
      - name: spec ↔ vektör kapsam ratchet'i
        run: python3 scripts/vectors/spec_coverage.py
      # A2.1: ref/crypto, vektörlerin BAĞIMSIZ kaynağıdır (Rust'tan türetilmez). Kapı olmazsa
      # referans sessizce bozulur ve ondan üretilen her vektör onunla birlikte bozulur.
      # stdlib-only, toolchain'siz, ~5 sn.
      - name: bağımsız kripto referansı (RFC 5869/7748/8032/8439 vektörleri)
        run: python3 ref/crypto/selftest.py
      # A2.2–A2.7: vectors/ccr-* dosyaları ELLE düzenlenemez — bağımsız referanstan yeniden üretilir ve
      # diskteki ile bayt-bayt karşılaştırılır. Fark = biri vektörü elle değiştirdi ya da referans kaydı.
      - name: Session Model V3 vektörleri referanstan yeniden üretilebiliyor mu
        run: python3 ref/crypto/gen_vectors.py --check

  # ── App↔Transport seam sözleşme kapısı (KM-SEAM-AT-001 §6/§7 iskeleti) ──
  # Aynı sözleşme süiti hem sahteye hem gerçeğe karşı koşar (Google SWE ch.13 "contract tests":
  # sahtenin doğruluğu ancak AYNI testin ikisine de koşturulmasıyla kanıtlanır). Bugün yalnız
  # `mock` hedefi kayıtlı; `real` BEYAN EDİLMİŞ BOŞLUKTUR (GAP-SEAM-REAL-1) ve runner onun için
  # ayrı bir çıkış kodu (3) döndürür — "atlandı" diye sessiz bir sonuç YOKTUR.
  #
  # Maliyet: tüm workspace değil, yalnız kama-integration'ın üç seam hedefi ve bağımlılıkları
  # derlenir; rust-cache paylaşılır.
  seam-conformance:
    name: seam conformance (App↔Transport; hedef=mock|real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Kapının kendi kapısı: on muhafızın (kırmızı test / vakum / kapsam yalanı / ratchet /
      # boşluk kapanışı / API drift / hedef parametresi / kategori sızıntısı / kanıt enflasyonu /
      # sessiz kapsam kaybı) gerçekten kırmızı olduğunu geçici mutasyonlarla kanıtlar ve ağacı
      # her durumda geri alır.
      - name: seam kapısının öz-testi
        run: scripts/ci/seam-conformance-selftest.sh

      - name: hedef = mock
        run: scripts/ci/seam-conformance.sh --target mock

      # Gerçek adapter indiğinde bu adım kendiliğinden 0 bekler hâle gelir; bugün 3 döner.
      # 1 (kırmızı) ve 2 (ortam/kullanım) her iki dönemde de kabul edilmez.
      - name: hedef = real (bugün beyan edilmiş boşluk)
        run: |
          set +e
          scripts/ci/seam-conformance.sh --target real
          code=$?
          set -e
          case "$code" in
            0) echo "gerçek adapter koştu ve yeşil" ;;
            3) echo "::notice title=SEAM_GAP::gerçek adapter yok — GAP-SEAM-REAL-1 beyanlı (çıkış 3)" ;;
            *) echo "::error title=TEST_FAILURE::seam real hedefi beklenmeyen çıkış kodu $code"; exit 1 ;;
          esac

  # ── Sonuç sınıflandırması: infra/billing hatası ile korelasyon hatası KARIŞMASIN ──
  ci-verdict:
    name: ci verdict (failure classification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, test-fast, conformance, seam-conformance, miri, asan, msan, security, aead-differential, vectors]
    if: always()
    steps:
      - name: classify
        run: |
          R='${{ join(needs.*.result, ',') }}'
          echo "job sonuçları: $R"
          if [[ "$R" == *failure* ]]; then
            echo "::error title=TEST_FAILURE::en az bir korelasyon kapisi kirmizi — transport dogrulugu incelenmeli"
            exit 1
          fi
          if [[ "$R" == *cancelled* ]]; then
            echo "::warning title=INFRA_FAILURE::job iptal edildi (timeout / concurrency / runner). Bu bir transport hatasi DEGILDIR."
            exit 1
          fi
          # [T-00.3] ATLANAN KAPI YESIL SAYILMAZ. Bu kontrol yoktu: bir job `if:` ya da
          # `paths` yuzunden atlanirsa sonucu `skipped` olur, yukaridaki iki kontrole takilmaz
          # ve verdict "tum kapilar yesil" derdi -- kosmayan bir kapi gecmis sayilirdi.
          if [[ "$R" == *skipped* ]]; then
            echo "::error title=TEST_FAILURE::en az bir kapi ATLANDI ($R). Atlanan kapi gecmis sayilmaz."
            exit 1
          fi
          echo "tum kapilar yesil"
