name: core-ci

# ── PR GERİ-BİLDİRİM HALKASI (hızlı, deterministik, sınırlı) ───────────────────────────────────
# [CI-REPAIR 2026-09-08] Bu dosya ÖLÇÜLEREK yeniden yapılandırıldı. Önceki hâli her PR push'unda
# ~233 faturalanan runner-dakikası harcıyordu (19 koşuda 4433 dk) ve GitHub Actions kotasını
# tüketip tüm pipeline'ı "billing" hatasıyla düşürdü. Ölçülen dağılım:
#   quality 141 dk (tam test setini DÖRT kez koşuyordu: locked / all-features / no-default / release)
#   semantic-matrix 5 shard = 180 dk · coverage 45 dk (continue-on-error, hep timeout)
#   diğer tüm job'lar toplam < 10 dk
# Ayrıca `concurrency` YOKTU: 22:29/22:30/22:31'de aynı PR için üç tam koşu paralel başladı.
#
# YENİ SÖZLEŞME:
#   PR      → yalnız hızlı, deterministik doğruluk (bu dosya)
#   main    → geniş entegrasyon + semantic-matrix + release/no-default/soak (main.yml)
#   nightly → shard'lı, timeout'lu, hostile/fuzz/coverage yükleri (nightly.yml)
#
# Ağır kama-integration panelleri PR'dan ÇIKARILDI (ölçüm: dr_cs3_v2_channel 21.3 dk,
# fs_s6_v2_pins 4.1 dk, fs_arqtail_pins 1.9 dk = test süresinin %65'i). main.yml onları TAM
# workspace koşumunda çalıştırır; feature-unification sözleşmesi (M1) orada korunur.

on:
  pull_request:
    paths-ignore:
      - 'reports/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Aynı dal için yalnız EN SON koşu yaşar. (Ölçüldü: iptal edilmeyen paralel koşular kotanın
# en büyük tek çarpanıydı.)
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Statik kapılar (fmt + iki clippy görünümü) ──
  static:
    name: static (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (all-features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # CI-05 — production görünümü (feature-unification kapısı)
      - name: clippy (no-default-features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  # ── Hızlı doğruluk: tam workspace, ağır entegrasyon panelleri hariç ──
  test-fast:
    name: test (all-features, hızlı küme)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # CI-01 — trybuild/K-WIRE-SEALED-TYPE-1 YALNIZ default-feature koşumunda çalışır.
      - name: sealed-type gate (default features, locked)
        run: |
          set -o pipefail
          out=$(cargo test -p kama-noise-wire --locked --test trybuild -- --list)
          echo "$out"
          echo "$out" | grep -q "sealed_type_cannot_be_forged" \
            || { echo "::error title=TEST_FAILURE::K-WIRE-SEALED-TYPE-1 kapisi 0 test kosuyor (BUL-03 regresyonu)"; exit 1; }

      - name: test (workspace --all-features, kama-integration hariç)
        run: cargo test --workspace --all-features --exclude kama-integration

      # [DENETİM] Ürün profili ve mekanizma-kablolaması PR'da deterministik olarak pinlenir.
      - name: product-profile invariants + activation smoke
        run: |
          set -o pipefail
          cargo test -p client-core --all-features --test product_profile_v1 2>&1 | tee /tmp/pp.txt
          grep -Eq "test result: ok\. [1-9][0-9]* passed" /tmp/pp.txt \
            || { echo "::error title=TEST_FAILURE::urun-profili pin testi 0 test kosuyor"; exit 1; }
          cargo test -p adaptive-transport --all-features --test fec_loss_risk

  # ── Ucuz derin kapılar (hepsi < 5 dk; ölçüldü) ──
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: miri (transport-schema) + non-empty gate assertion
        run: |
          set -o pipefail
          cargo +nightly miri test -p kama-transport-schema 2>&1 | tee miri.log
          grep -Eq "test result: ok\. [1-9][0-9]* passed" miri.log \
            || { echo "::error title=TEST_FAILURE::miri kapisi 0 test kosuyor (BUL-02 regresyonu)"; exit 1; }

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ASan (noise-wire)
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: cargo +nightly test -p kama-noise-wire -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: ASan (fec-codec)
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: cargo +nightly test -p kama-fec-codec -Zbuild-std --target x86_64-unknown-linux-gnu

  msan:
    name: msan (uninitialized memory, SIMD deps)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: msan (kama-fec-codec)
        env:
          RUSTFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins"
        run: cargo +nightly test -p kama-fec-codec --tests --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: msan (kama-noise-wire)
        env:
          RUSTFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins"
        run: cargo +nightly test -p kama-noise-wire --tests --target x86_64-unknown-linux-gnu -Zbuild-std

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      # BUL-14 / AÇIK-2: sodiumoxide 0.2.7 → RUSTSEC-2021-0137 (unmaintained; bakımsız-uyarı,
      # istismar edilebilir açık DEĞİL). Karar verilene dek AÇIKÇA yok sayılır — aksi hâlde job
      # her koşuda kırmızı olur ve kapı sinyal taşımaz (ölçüldü: 4/16 kırmızının nedeni buydu).
      - name: cargo audit (bilinen bakımsız-uyarı hariç)
        run: cargo audit --ignore RUSTSEC-2021-0137
      - name: cargo deny
        run: cargo deny check

  aead-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kama-noise-wire --features libsodium-oracle --test aead_differential -- --nocapture

  # ── Sonuç sınıflandırması: infra/billing hatası ile korelasyon hatası KARIŞMASIN ──
  ci-verdict:
    name: ci verdict (failure classification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, test-fast, miri, asan, msan, security, aead-differential]
    if: always()
    steps:
      - name: classify
        run: |
          R='${{ join(needs.*.result, ',') }}'
          echo "job sonuçları: $R"
          if [[ "$R" == *failure* ]]; then
            echo "::error title=TEST_FAILURE::en az bir korelasyon kapisi kirmizi — transport dogrulugu incelenmeli"
            exit 1
          fi
          if [[ "$R" == *cancelled* ]]; then
            echo "::warning title=INFRA_FAILURE::job iptal edildi (timeout / concurrency / runner). Bu bir transport hatasi DEGILDIR."
            exit 1
          fi
          echo "tum kapilar yesil"
