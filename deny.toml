[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-root-certs (bench→quinn/rustls; Linux'ta build edilmez, target-gated) — permissive data lisansı.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace-içi path dep'ler (ör. bench → adaptive-transport) version'suzdur → wildcard sayılır;
# path dep'leri istisna tut (dış crate wildcard'ları HÂLÂ deny — sürüm-pinleme disiplini korunur).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
